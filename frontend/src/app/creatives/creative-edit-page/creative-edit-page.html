<header class="page-header">
  <a routerLink="/creatives">&larr; All Creatives</a>
  <h1>{{ heading() }}</h1>
  @if (summary()) {
    <p class="summary">{{ summary() }}</p>
  }
</header>

@if (store.loading()) {
  <p role="status">Loading…</p>
}

@if (store.error(); as error) {
  <p role="alert" class="error">{{ error.message }}</p>
}

@if (store.conflict(); as conflict) {
  <app-conflict-banner
    [conflict]="conflict"
    [saving]="store.saving()"
    (loadLatest)="loadLatest()"
    (keepMine)="keepMyEdits()"
  />
}

@if (canRetry()) {
  <button type="button" class="retry" (click)="load()">Try again</button>
}

@if (showForm()) {
  <app-creative-form
    [creative]="store.selected()"
    [saving]="store.saving()"
    [fieldErrors]="fieldErrors()"
    (draftChange)="onDraftChange($event)"
    (saved)="save($event)"
  />
}
