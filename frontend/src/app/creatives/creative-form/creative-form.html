<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @for (field of fields; track field.key) {
    <div class="field">
      <label [for]="'field-' + field.key">{{ field.label }}</label>
      @if (field.multiline) {
        <textarea [id]="'field-' + field.key" [attr.name]="field.key" [formControlName]="field.key" rows="4"></textarea>
      } @else {
        <input [id]="'field-' + field.key" [attr.name]="field.key" [formControlName]="field.key" type="text" />
      }
      @if (messages()[field.key]; as message) {
        <p class="field-error" role="alert">{{ message }}</p>
      }
    </div>
  }
  <button type="submit" [disabled]="form.invalid || saving()">
    {{ saveLabel() }}
  </button>
</form>
